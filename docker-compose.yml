# Запуск одной командой:  docker compose up --build
#
# Дашборд поднимается на эталонных данных сразу, без ключей и без сети.
# Результаты прогонов подключены только на чтение — интерфейс ничего в
# них не меняет. На запись открыт единственный каталог: очередь заданий.

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: aios-dashboard:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      AIOS_LOG_LEVEL: "${AIOS_LOG_LEVEL:-INFO}"
      # 1 — меню запуска пропадает, ручки запуска отвечают отказом.
      # Так собирается сборка для организаторов.
      AIOS_READONLY: "${AIOS_READONLY:-0}"
    volumes:
      - "${AIOS_DATA_DIR:-~/aios-data}/rolling:/data/rolling:ro"
      - "${AIOS_DATA_DIR:-~/aios-data}/probes:/data/probes:ro"
      - "${AIOS_DATA_DIR:-~/aios-data}/queue:/data/queue"
      - ./configs:/app/configs:ro
      - ./submission:/app/submission:ro
    restart: unless-stopped

  # Воркер очереди. Запускает симулятор, поэтому собирается из образа
  # с OPM Flow, а не из образа дашборда. Профиль worker: по умолчанию
  # не поднимается, чтобы `docker compose up` у организаторов не тянул
  # тяжёлый образ.
  #
  #   docker compose --profile worker up -d worker
  #
  # worker:
  #   profiles: ["worker"]
  #   build:
  #     context: .
  #     dockerfile: scripts/Dockerfile
  #   command: python -m aios.dashboard.worker
  #   environment:
  #     AIOS_RUN_CMD: "${AIOS_RUN_CMD:-}"
  #     AIOS_QUEUE_DIR: /data/queue
  #     AIOS_DATA_DIR: /data
  #     AIOS_LIVE_DIR: /data/rolling
  #     AIOS_CONFIG_DIR: /app/configs
  #   volumes:
  #     - "${AIOS_DATA_DIR:-~/aios-data}:/data"
  #     - ./configs:/app/configs
  #     - ./src:/app/src
