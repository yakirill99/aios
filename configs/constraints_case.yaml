# Ограничения валидационного кейса (документ организаторов от 11.09.2026).
#
# ВНИМАНИЕ: документ описывает горизонт 01.01.2012 — 31.12.2018 с историей
# по 31.12.2011. Наше сданное решение считалось на окне 01.01.2014 —
# 01.12.2015. Ниже закодировано всё, что в документе, — применяется та
# часть, что попадает в расчётный период.

well:
  max_liquid_rate: 500.0          # предел методики, не из этого документа
  min_bhp_producer: 50.0          # «для добывающего фонда 50 атм»
  max_bhp_injector: 300.0         # «ограничение по забойному 300 атм»
  economic_watercut_limit: 0.985
  min_interval_months: 9          # «частые необоснованные замены ЭЦН нежелательны»

field:
  # Инфраструктурные лимиты с 01.01.2012. По документу снимаются после
  # 01.01.2015; даты в структуре не поддерживаются, поэтому лимит задан
  # как действующий — так проверка строже, а не мягче.
  max_total_liquid_rate: 4000.0      # м3/сут, сумма по фонду
  max_total_injection_rate: 4000.0   # м3/сут, сумма по фонду
  compensation_min: 0.80
  compensation_max: 1.20

# Программа ремонтов: скважины гарантированно недоступны. Отменить
# ремонт или продлить работу скважины нельзя.
unavailable:
  - {well: "40", start: 2013-04-01, end: 2013-08-01, reason: "ремонт"}
  - {well: "26", start: 2014-10-01, end: 2015-02-01, reason: "ремонт"}
  - {well: "30", start: 2015-05-01, end: 2015-09-01, reason: "ремонт"}
  - {well: "37", start: 2015-12-01, end: 2016-03-01, reason: "ремонт"}
  - {well: "25", start: 2016-06-01, end: 2016-10-01, reason: "ремонт"}
  - {well: "24", start: 2017-02-01, end: 2017-05-01, reason: "ремонт"}
  - {well: "45", start: 2017-09-01, end: 2018-01-01, reason: "ремонт"}
  - {well: "42", start: 2018-04-01, end: 2018-09-01, reason: "ремонт"}
