# Пороги паспорта скважины. Правит Камелия.
# Кирилл: код читает этот файл, чисел в коде нет.
#
# Правишь YAML -> перезапуск well_passport.py -> карточки обновились.

обводнённость:
  экономический_предел: 0.985      # из методики, не трогаем
  высокая: 0.92
  порог_быстрого_роста_в_месяц: 0.004
  тег_высокая: "обводнена, близка к пределу"
  тег_быстрый_рост: "обводняется опережающе"
  тег_норма: "обводнённость умеренная"
  тег_за_пределом: "за экономическим пределом обводнённости"

падение_дебита:
  быстрое_в_месяц: 0.015
  тег_быстрое: "дебит падает быстро"
  тег_умеренное: "дебит падает умеренно"
  тег_стабильна: "дебит стабилен"

продуктивность:
  запас_до_предела_доля: 0.5
  тег_есть_запас: "есть куда форсировать"
  тег_упирается: "у предела по жидкости"
  тег_не_отвечает: "не выходит на заданный режим"

# ==========================================================================
# ЗАМЕЧАНИЕ 1. Скважина без нефти закрывается.
# Проверяется первым, до остальных правил (ключ «приоритет»).
# ==========================================================================
убыточные:
  порог_нефти_м3_сут: 0.5
  тег_кандидат_на_закрытие: "кандидат на закрытие (нет нефти)"
  приоритет: 1
  действие: "закрыть"

# ==========================================================================
# ЗАМЕЧАНИЕ 2. Запрет форсирования по обводнённости.
#
# жёсткий_запрет: true  — скважина вычёркивается из кандидатов на
#                         форсирование в цикле оптимизации;
#                 false — тег и рекомендация в паспорте есть, отбор
#                         кандидатов не ограничивается.
#
# ЦЕНА ЖЁСТКОГО ЗАПРЕТА, измерено по журналам ночных прогонов:
#   порог 0.90 запрещает воздействие 43_x3 (скв. 43 работает на 95,7%),
#   давшее +25,6 млн — второй по величине выигрыш прогона.
#   Экономический предел из методики — 98,5%: при марже нефти 8360 руб/т
#   против 100 руб/м3 на подъём скважина на 95% остаётся прибыльной.
# ==========================================================================
запрет_форсирования:
  обводнённость_критическая: 0.90
  тег_запрет_форсирования: "форсирование запрещено (высокая обводнённость)"
  действие_вместо_форсирования: "снижение отбора или закрытие"
  приоритет: 2
  жёсткий_запрет: true

# ==========================================================================
# ЗАМЕЧАНИЕ 3. Запрет форсирования по достигнутому дебиту жидкости.
#
# ЦЕНА ЖЁСТКОГО ЗАПРЕТА, измерено:
#   потолок 100 м3/сут запрещает ВСЕ четыре принятых добывающих
#   воздействия лучшего прогона (PACK_prod_x1p5 +99,2; 43_x3 +25,6;
#   44_x3 +8,9; 40_x3 +3,5) = 137,2 млн из 146,9. Остаётся только
#   закачка: ЧДД около 1 028,7 вместо 1 165,9.
#
#   Значение 100 м3/сут — потолок ИСТОРИЧЕСКОГО расписания организаторов,
#   а не отдача пласта: симулятор вывел эти скважины на 150 и 300 м3/сут
#   с ростом нефти. Поскважинный физический предел выше 100 и виден по
#   разделу «забойное» ниже: скв. 40 и 44 при цели 300 и 450 вышли на
#   61-62% — вот где настоящий потолок.
# ==========================================================================
запрет_форсирования_потолок:
  дебит_жидкости_потолок: 100.0
  тег_упёрлась_в_потолок: "упёрлась в потолок по жидкости"
  действие_вместо_форсирования: "только снижение или NOOP"
  приоритет: 3
  жёсткий_запрет: true

# ==========================================================================
# Физический признак недостижимости режима — предложение Кирилла на
# вычитку. Отвечает на замечание 3 по существу: форсировать бесполезно не
# ту скважину, что стоит на 100, а ту, что стоит на техминимуме забойного
# и уже отбирает всё, что даёт пласт.
#
# Проверено на снапшоте фонда: на 50 бар стоят 11 добывающих
# (1, 9, 17, 22, 23, 29, 35, 38, 49, 50, 56). Семь из них — ровно те,
# кого правила выше оставляют «разрешёнными к форсированию».
#
# Раздел закомментирован: включается после решения гидродинамика.
# ==========================================================================
# забойное:
#   техминимум_бар: 50.0
#   допуск_бар: 1.0
#   тег_на_техминимуме: "забойное на техминимуме, отбор ограничен пластом"
#   приоритет: 4
#   жёсткий_запрет: false

экономика:
  маржа_нефти_руб_т: 8360          # из методики
  подъём_жидкости_руб_м3: 100      # из методики
  плотность_нефти: 0.832           # из деки, секция DENSITY
  порог_убыточности_тыс_руб_сут: 0
  порог_грани_тыс_руб_сут: 50
  тег_убыточна: "убыточна при текущем режиме"
  тег_на_грани: "на грани рентабельности"
  тег_прибыльна: "приносит прибыль"

индекс_продуктивности:
  # ВНИМАНИЕ: если в сводке нет поскважинного пластового давления,
  # перепад считается от среднего по полю (FPR). Для сравнения скважин
  # между собой это годится, для абсолютной оценки — нет. Скрипт
  # помечает такие карточки признаком source=field.
  критический_снижение_за_месяц: 0.02
  высокий_м3_сут_на_бар: 0.5       # ← уточнить после первого расчёта
  тег_снижается: "индекс продуктивности падает"
  тег_стабилен: "индекс продуктивности стабилен"
  тег_высокий: "индекс продуктивности высокий"

пластовое_давление:
  # Абсолютные значения в барах.
  низкое: 80.0
  высокое: 250.0                   # ← уточнить после первого расчёта
  тег_низкое: "пластовое давление низкое"
  тег_норма: "пластовое давление в норме"
  тег_высокое: "пластовое давление высокое"

эцн:
  порог_хрупкости_м3_сут: 15
  тег_у_границы: "насос у границы интервала"

связность:
  порог_многих: 3
  тег_влияет_на_многих: "подпирает несколько скважин"
  тег_изолирована: "связей в окне нет"
