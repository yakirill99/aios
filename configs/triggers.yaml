# Условия вмешательства. Между срабатываниями система наблюдает: снимает
# состояние, считает производные, пишет трейс — но воздействий не назначает.
#
# Обоснование:
#   экономика  — переключение стоит ~1 млн, смена ЭЦН 2,35-9,85 млн
#   физика     — медиана лага отклика 6 мес по нефти
#   вычисления — меньше шагов = меньше прогонов

enabled: true

conditions:
  water_breakthrough:
    threshold: 0.975            # обводнённость, при пределе 98,5%
    comment: приближение к экономическому пределу

  productivity_drop:
    threshold: 0.08             # темп падения дебита за шаг
    comment: потеря добычи требует реакции

  unprofitable:
    enabled: true
    comment: вклад скважины в денежный поток отрицателен

  injection_no_response:
    max_useful_links: 0
    comment: |
      Нагнетательная, чьи связи не успеют проявиться до конца горизонта.
      Критерий динамический: лаг + месяц вмешательства <= 23.
      Связь с лагом 10 мес полезна на 5-м месяце и бесполезна на 18-м.

  first_step:
    always: true
    comment: точка передачи управления — вмешательство обязательно

# Порог выигрыша: ниже не переключаемся, само переключение стоит ~1 млн
min_gain_mln: 2.0

# У конца горизонта только быстрые воздействия имеют смысл: закачка
# не успеет отработать, форсирование отбора даёт эффект сразу
fast_actions_only_when_months_left: 6
