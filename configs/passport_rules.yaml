# Пороги паспорта скважины. Правит Камелия.
# Кирилл: код читает этот файл, чисел в коде нет.
#
# Правишь YAML -> перезапуск well_passport.py -> карточки обновились.

обводнённость:
  экономический_предел: 0.985      # из методики, не трогаем
  высокая: 0.92
  порог_быстрого_роста_в_месяц: 0.004
  тег_высокая: "обводнена, близка к пределу"
  тег_быстрый_рост: "обводняется опережающе"
  тег_норма: "обводнённость умеренная"

падение_дебита:
  быстрое_в_месяц: 0.015
  тег_быстрое: "дебит падает быстро"
  тег_умеренное: "дебит падает умеренно"
  тег_стабильна: "дебит стабилен"

продуктивность:
  запас_до_предела_доля: 0.5
  тег_есть_запас: "есть куда форсировать"
  тег_упирается: "у предела по жидкости"
  тег_не_отвечает: "не выходит на заданный режим"

экономика:
  маржа_нефти_руб_т: 8360          # из методики
  подъём_жидкости_руб_м3: 100      # из методики
  плотность_нефти: 0.832           # из деки, секция DENSITY
  порог_убыточности_тыс_руб_сут: 0
  порог_грани_тыс_руб_сут: 50
  тег_убыточна: "убыточна при текущем режиме"
  тег_на_грани: "на грани рентабельности"
  тег_прибыльна: "приносит прибыль"

индекс_продуктивности:
  # ВНИМАНИЕ: если в сводке нет поскважинного пластового давления,
  # перепад считается от среднего по полю (FPR). Для сравнения скважин
  # между собой это годится, для абсолютной оценки — нет. Скрипт
  # помечает такие карточки признаком source=field.
  критический_снижение_за_месяц: 0.02
  высокий_м3_сут_на_бар: 0.5       # ← уточнить после первого расчёта
  тег_снижается: "индекс продуктивности падает"
  тег_стабилен: "индекс продуктивности стабилен"
  тег_высокий: "индекс продуктивности высокий"

пластовое_давление:
  # Абсолютные значения в барах.
  низкое: 80.0
  высокое: 250.0                   # ← уточнить после первого расчёта
  тег_низкое: "пластовое давление низкое"
  тег_норма: "пластовое давление в норме"
  тег_высокое: "пластовое давление высокое"

эцн:
  порог_хрупкости_м3_сут: 15
  тег_у_границы: "насос у границы интервала"

связность:
  порог_многих: 3
  тег_влияет_на_многих: "подпирает несколько скважин"
  тег_изолирована: "связей в окне нет"
