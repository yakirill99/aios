# Технологические и внешние ограничения.
#
# Читается модулем scripts/constraints.py. Проверяется в трёх местах:
#   schedule_builder.validate()  — до генерации файла
#   rolling_horizon              — отбор целей и отбраковка кандидатов
#   validate_output.py           — по результату прогона
#
# Правка этого файла ВЛИЯЕТ на поведение. Раньше пределы жили здесь и
# отдельно константами в коде, и файл был декоративен.

well:
  # Жёсткий предел методики ЧДД: выше расчётчик выдаёт ошибку,
  # а не предупреждение.
  max_liquid_rate: 500.0        # м3/сут
  # Из WCONPROD в деке, подтверждено организаторами как единственное
  # ограничение на обучающей модели.
  min_bhp_producer: 50.0        # бар
  # Из WCONINJE: выше — риск разрыва пласта.
  max_bhp_injector: 300.0       # бар
  # Экономический предел, не технологический. Следует из методики:
  # маржа нефти 8360 руб/т против 100 руб/т на подъём жидкости.
  # Привычные из литературы 90-95% здесь неверны.
  economic_watercut_limit: 0.985
  # Медиана лага отклика по нефти — 4 месяца (матрица влияния).
  min_interval_months: 9

field:
  # На обучающей модели групповых ограничений не задано.
  # В валидационном кейсе придут квоты и лимиты — вписать сюда.
  max_total_liquid_rate: null      # м3/сут, сумма по фонду в каждой точке
  max_total_injection_rate: null   # м3/сут, сумма по фонду
  max_total_oil_period: null       # тыс. т за весь управляющий период
  max_actions_per_step: null       # шт.
  # Компенсация закачки: отношение накопленной закачки к отбору.
  # Пороги предварительные, уточняются гидродинамиком.
  compensation_min: 0.80
  compensation_max: 1.20

actions:
  # Словарь допустимых воздействий. Гипотезы порождаются только отсюда.
  allowed:
    - SET_LIQUID_RATE           # WCONPROD LRAT
    - SET_BHP                   # WCONPROD BHP
    - SET_INJECTION_RATE        # WCONINJE RATE
    - SHUT_WELL
    - OPEN_WELL
  # Перевод под закачку методика описывает (5 млн руб), но она едина для
  # обоих треков, а лекция относила его ко второму. До подтверждения не
  # используем.
  disabled:
    - CONVERT_TO_INJECTOR

# Недоступность скважин: ремонты и прочие простои с привязкой к датам.
# Можно задавать здесь или отдельным файлом через --events.
# unavailable:
#   - well: 42
#     from: 2014-04-01
#     to:   2014-06-30
#     reason: ремонт
