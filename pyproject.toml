[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-dashboard"
version = "0.2.0"
description = "Веб-дашборд AIOS: NPV, фонд скважин, журнал прогона, запуск прогонов"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aios.dashboard*"]
namespaces = true
