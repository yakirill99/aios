<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOS Dashboard - Реальные данные</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Заголовок */
        .header {
            background: linear-gradient(135deg, #1a1f35 0%, #2d3748 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #58a6ff, #3fb950, #f85149);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-status {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            background: #21262d;
            border: 1px solid #30363d;
        }
        
        .status-badge.success {
            background: rgba(46,160,67,0.15);
            border-color: #3fb950;
            color: #3fb950;
        }
        
        .status-badge.warning {
            background: rgba(187,128,9,0.15);
            border-color: #d29922;
            color: #d29922;
        }
        
        /* Метрики */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .metric-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .metric-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .metric-label {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 8px;
        }
        
        .metric-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #58a6ff;
        }
        
        .metric-value.positive {
            color: #3fb950;
        }
        
        .metric-value.negative {
            color: #f85149;
        }
        
        /* Секции */
        .section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 15px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        
        /* График */
        .chart-container {
            height: 400px;
            position: relative;
            background: #21262d;
            border-radius: 8px;
            padding: 20px;
        }
        
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Таблица скважин */
        .wells-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .wells-table th {
            background: #21262d;
            padding: 12px;
            text-align: left;
            color: #8b949e;
            font-size: 0.9rem;
            border-bottom: 2px solid #30363d;
        }
        
        .wells-table td {
            padding: 10px;
            border-bottom: 1px solid #21262d;
        }
        
        .wells-table tr:hover {
            background: #1a1f35;
        }
        
        .well-status {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .well-status.active {
            background: rgba(46,160,67,0.2);
            color: #3fb950;
        }
        
        .well-status.inactive {
            background: rgba(139,148,158,0.2);
            color: #8b949e;
        }
        
        .well-status.warning {
            background: rgba(187,128,9,0.2);
            color: #d29922;
        }
        
        .well-status.danger {
            background: rgba(248,81,73,0.2);
            color: #f85149;
        }
        
        /* Фильтры */
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .filter-btn:hover {
            background: #30363d;
        }
        
        .filter-btn.active {
            background: #58a6ff;
            color: #0d1117;
        }
        
        /* Агенты */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .agent-card {
            background: #21262d;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #30363d;
        }
        
        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .agent-name {
            font-weight: 700;
            color: #58a6ff;
        }
        
        .agent-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .agent-status.active {
            background: #3fb950;
            box-shadow: 0 0 10px rgba(63,185,80,0.5);
        }
        
        .agent-status.inactive {
            background: #8b949e;
        }
        
        /* Действия */
        .actions-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .action-item {
            padding: 10px;
            border-bottom: 1px solid #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .action-item:last-child {
            border-bottom: none;
        }
        
        .action-type {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            background: #30363d;
        }
        
        .action-type.prod {
            background: rgba(88,166,255,0.2);
            color: #58a6ff;
        }
        
        .action-type.inj {
            background: rgba(187,128,9,0.2);
            color: #d29922;
        }
        
        .action-type.shut {
            background: rgba(248,81,73,0.2);
            color: #f85149;
        }
        
        /* JSON просмотр */
        .json-view {
            background: #21262d;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        .json-key {
            color: #58a6ff;
        }
        
        .json-value {
            color: #3fb950;
        }
        
        .json-number {
            color: #d29922;
        }
        
        /* Анимация загрузки */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Заголовок -->
        <div class="header">
            <div class="header-title">🎯 AIOS Dashboard</div>
            <div class="header-status">
                <div class="status-badge success" id="system-status">✅ Система работает</div>
                <div class="status-badge" id="iterations-badge">Итераций: 0</div>
            </div>
        </div>
        
        <!-- Основные метрики -->
        <div class="metrics-grid" id="metrics-grid">
            <!-- Динамически заполняется -->
        </div>
        
        <!-- График NPV -->
        <div class="section">
            <div class="section-title">📈 Динамика NPV по итерациям</div>
            <div class="chart-container">
                <canvas id="npvChart"></canvas>
            </div>
        </div>
        
        <!-- Таблица скважин -->
        <div class="section">
            <div class="section-title">🛢️ Состояние скважин</div>
            
            <!-- Фильтры -->
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterWells('all')">Все</button>
                <button class="filter-btn" onclick="filterWells('prod')">Добывающие</button>
                <button class="filter-btn" onclick="filterWells('inj')">Нагнетательные</button>
                <button class="filter-btn" onclick="filterWells('warning')">С проблемами</button>
            </div>
            
            <table class="wells-table" id="wells-table">
                <thead>
                    <tr>
                        <th>Скважина</th>
                        <th>Тип</th>
                        <th>Дебит нефти (м³/сут)</th>
                        <th>Дебит жидкости (м³/сут)</th>
                        <th>Обводнённость (%)</th>
                        <th>Статус</th>
                        <th>Последнее действие</th>
                    </tr>
                </thead>
                <tbody id="wells-tbody">
                    <!-- Динамически заполняется -->
                </tbody>
            </table>
        </div>
        
        <!-- Агенты -->
        <div class="section">
            <div class="section-title">🤖 Статус агентов</div>
            <div class="agents-grid" id="agents-grid">
                <!-- Динамически заполняется -->
            </div>
        </div>
        
        <!-- Действия -->
        <div class="section">
            <div class="section-title">📋 История действий</div>
            <div class="actions-list" id="actions-list">
                <!-- Динамически заполняется -->
            </div>
        </div>
        
        <!-- Данные JSON -->
        <div class="section">
            <div class="section-title">📊 Данные из journal.json</div>
            <div class="json-view" id="json-view">
                <!-- Динамически заполняется -->
            </div>
        </div>
    </div>
    
    <!-- Chart.js для графиков -->
    <script src="vendor/chart.umd.js"></script>
    
    <script src="dashboard.js"></script>
</body>
</html>
